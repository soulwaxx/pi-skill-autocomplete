name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # renovate: datasource=npm depName=npm
  NPM_VERSION: '11.21.1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - name: Install npm CLI
        run: npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-fund
      - name: Install locked development and release dependencies
        run: |
          npm ci --ignore-scripts --no-fund
          npm ci --prefix .github/release-tools --ignore-scripts --no-fund
      - name: Release configuration and regression tests
        run: npm run release:check && npm run test:release
      - name: Source tests, type checking, and lint
        run: npm run check
      - name: Runtime feasibility tests
        run: npm run test:feasibility
      - name: Packed runtime tests
        run: npm run test:artifact
      - name: Completion and submission benchmarks
        run: npm run bench

  workflow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Install npm CLI
        run: npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-fund
      - name: Audit locked development and release dependencies
        run: |
          npm ci --ignore-scripts --no-fund
          npm ci --prefix .github/release-tools --ignore-scripts --no-fund
          npm audit --audit-level=critical
          npm audit --prefix .github/release-tools --audit-level=critical
      - name: Validate workflows with checksum-verified actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: v1.7.12
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          gh release download "$ACTIONLINT_VERSION" --repo rhysd/actionlint \
            --pattern '*_linux_amd64.tar.gz' --pattern '*_checksums.txt' --dir "$work"
          (
            cd "$work"
            sha256sum --check --ignore-missing ./*_checksums.txt
            tar -xzf ./*_linux_amd64.tar.gz actionlint
          )
          "$work/actionlint" -color

  ci:
    name: CI passed
    if: always()
    needs: [test, workflow-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-validation.result }}
        run: test "$TEST_RESULT" = success && test "$WORKFLOW_RESULT" = success
      - name: Checkout tested source for evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested PR source
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node .github/release-tools/release-source.mjs record "$RUNNER_TEMP/source.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: verified-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source.json
          if-no-files-found: error
          retention-days: 30
